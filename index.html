    <style>
      /* Custom scrollbar hiding for cleaner mobile look */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Universal Print Styles - Guaranteed 1-Page Output */
      @media print {
        @page {
          size: A4 portrait;
          margin: 0;
        }

        /* 1. Hide everything in the body by default */
        body * {
          visibility: hidden !important;
        }

        /* 2. Completely remove background elements from page flow */
        nav, aside, header, .print\:hidden, .no-print, button, .print-hidden {
          display: none !important;
        }

        /* 3. Make ONLY the active printable document sheet visible */
        .print-sheet-active,
        .print-sheet-active * {
          visibility: visible !important;
        }

        /* 4. Fit the printable sheet precisely onto 1 single page */
        .print-sheet-active {
          position: fixed !important;
          left: 0 !important;
          top: 0 !important;
          width: 100% !important;
          height: auto !important;
          max-height: 100vh !important;
          margin: 0 !important;
          padding: 8mm 10mm !important;
          box-sizing: border-box !important;
          background: #ffffff !important;
          overflow: hidden !important;
          page-break-after: avoid !important;
          page-break-before: avoid !important;
          page-break-inside: avoid !important;
          break-inside: avoid !important;
        }

        /* Thermal POS receipt fit */
        .print-sheet-receipt {
          position: fixed !important;
          left: 50% !important;
          transform: translateX(-50%) !important;
          top: 0 !important;
          width: 80mm !important;
          max-width: 80mm !important;
          padding: 4mm !important;
        }

        /* 5. Restrict body height to prevent trailing blank pages */
        html, body {
          background: #ffffff !important;
          color: #000000 !important;
          width: 100% !important;
          height: 100% !important;
          max-height: 100vh !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow: hidden !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* 6. Pure black typography */
        .print-sheet-active,
        .print-sheet-active * {
          color: #000000 !important;
          -webkit-text-fill-color: #000000 !important;
          text-shadow: none !important;
          box-shadow: none !important;
        }
      }
    </style>
